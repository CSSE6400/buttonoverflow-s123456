name: Cloud Assignment

on:
  push:
  workflow_dispatch:
    inputs:
      functionality:
        description: 'Run functionality'
        required: false
        type: boolean
        default: false
      load:
        description: 'Run load'
        required: false
        type: boolean
        default: false
      aws-access-key-id:
        description: 'AWS Access Key ID'
        required: false
        type: string
      aws-secret-access-key:
        description: 'AWS Secret Access Key'
        required: false
        type: string
      aws-session-token:
        description: 'AWS Session Token'
        required: false
        type: string

jobs:
  lint:
    uses: csse6400/workflows/.github/workflows/lint.yml@main
    secrets: inherit

  deploy:
    uses: csse6400/workflows/.github/workflows/cloud.yml@main
    secrets: inherit
    with:
      assignment: 'buttonoverflow'
      functionality: ${{ inputs.functionality || 'false' }}
      load: ${{ inputs.load || 'false' }}
      aws-access-key-id: ${{ inputs.aws-access-key-id || '' }}
      aws-secret-access-key: ${{ inputs.aws-secret-access-key || '' }}
      aws-session-token: ${{ inputs.aws-session-token || '' }}